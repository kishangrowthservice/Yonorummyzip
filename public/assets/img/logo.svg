<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Yono Rummy Zip Logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="45%" stop-color="#6d28d9"/>
      <stop offset="75%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffec8a"/>
      <stop offset="55%" stop-color="#f5b921"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe27a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <clipPath id="clip"><rect x="8" y="8" width="496" height="496" rx="104"/></clipPath>
  </defs>

  <!-- Vibrant game-app rounded square -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="url(#gold)" stroke-width="10"/>
  <g clip-path="url(#clip)">
    <!-- Glossy top highlight -->
    <ellipse cx="256" cy="30" rx="330" ry="150" fill="url(#gloss)"/>
    <circle cx="470" cy="400" r="130" fill="#ffffff" opacity="0.08"/>
    <circle cx="30" cy="470" r="100" fill="#000000" opacity="0.10"/>
  </g>

  <!-- Ace playing card motif (top-left) -->
  <g transform="rotate(-14 100 118)">
    <rect x="56" y="50" width="90" height="128" rx="12" fill="#ffffff"/>
    <rect x="56" y="50" width="90" height="128" rx="12" fill="none" stroke="#e2e8f0" stroke-width="3"/>
    <text x="74" y="94" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="800" fill="#dc2626">A</text>
    <text x="68" y="132" font-family="Arial, Helvetica, sans-serif" font-size="32" fill="#dc2626">&#9829;</text>
  </g>

  <!-- Gold coin stack motif (top-right) -->
  <g>
    <ellipse cx="404" cy="158" rx="52" ry="16" fill="#b45309"/>
    <rect x="352" y="128" width="104" height="30" fill="#d97706"/>
    <ellipse cx="404" cy="128" rx="52" ry="16" fill="url(#gold)"/>
    <ellipse cx="404" cy="104" rx="52" ry="16" fill="#b45309"/>
    <rect x="352" y="74" width="104" height="30" fill="#d97706"/>
    <ellipse cx="404" cy="74" rx="52" ry="16" fill="url(#gold)"/>
    <rect x="393" y="63" width="22" height="22" rx="3" transform="rotate(45 404 74)" fill="#92400e"/>
  </g>

  <!-- Big bold brand -->
  <text x="256" y="292" font-family="Arial, Helvetica, sans-serif" font-size="106" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">YO<tspan fill="url(#gold)">NO</tspan></text>

  <!-- Gold ribbon banner -->
  <g>
    <path d="M52 330 L96 330 L82 368 L96 406 L52 406 L66 368 Z" fill="#b45309"/>
    <path d="M460 330 L416 330 L430 368 L416 406 L460 406 L446 368 Z" fill="#b45309"/>
    <rect x="84" y="322" width="344" height="92" rx="14" fill="url(#ribbon)"/>
    <rect x="84" y="322" width="344" height="92" rx="14" fill="none" stroke="#92400e" stroke-width="3"/>
    <text x="256" y="384" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="800" fill="#1e1b4b" text-anchor="middle" letter-spacing="4">RUMMY ZIP</text>
  </g>

  <text x="256" y="470" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#e9d5ff" text-anchor="middle" letter-spacing="3">YONORUMMYZIP.COM</text>
</svg>
